name: unity-editmode

# Trial: runs the full Unity EditMode suite in the Unity editor (GameCI editor image), the suite otherwise run by hand
# before merge. Not yet a required check: it runs only on manual dispatch, or on a pull request into main that carries the
# `unity-editmode` label (elsewhere the job is skipped). On a labelled pull request automerge sees it like any other
# check. Needs repository secrets UNITY_EMAIL and UNITY_PASSWORD (Personal named-user activation, see
# tools/unity-ci/run-editmode.sh); UNITY_LICENSE (text of a .ulf file) is optional. Only the result XML is uploaded,
# never the editor log.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: unity-editmode-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_IMAGE: unityci/editor:ubuntu-6000.6.0f1-base-3

jobs:
  editmode:
    name: unity-editmode
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'unity-editmode')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check secrets are set
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::missing repository secrets:$missing"; exit 1; fi

      - name: Free disk space for the editor image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check editor version matches the image
        run: |
          want=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          case "$UNITY_IMAGE" in *"-$want-"*) echo "editor $want";; *) echo "::error::image $UNITY_IMAGE does not match $want"; exit 1;; esac

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_IMAGE }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-${{ env.UNITY_IMAGE }}-

      - name: Pull editor image
        run: docker pull -q "$UNITY_IMAGE"

      - name: EditMode tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          code=0
          docker run --rm -v "$PWD:/project" -w /project \
            -e UNITY_LICENSE -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" bash tools/unity-ci/run-editmode.sh unity-results || code=$?
          sudo chown -R "$(id -u):$(id -g)" Library unity-results 2>/dev/null || true
          exit $code

      - name: Summary
        if: always()
        run: python3 tools/unity-ci/summarize.py unity-results >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editmode-${{ github.event.pull_request.head.sha || github.sha }}
          path: unity-results/*.xml
          if-no-files-found: warn
          retention-days: 14
