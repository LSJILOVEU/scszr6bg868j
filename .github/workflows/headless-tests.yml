name: headless-tests

# .NET 8 headless build of the simulation and its tests (tools/headless). Unity-only gates are not run here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Source-fingerprint tests hash files byte for byte; keep LF on Windows too.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build tools/headless/WarCore.Headless.Tests.csproj -c Release
      - name: Test
        run: dotnet test tools/headless/WarCore.Headless.Tests.csproj -c Release --no-build --filter "TestCategory!=StackBound&TestCategory!=Manual"
      - name: Stack bound (explicit, Linux)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test tools/headless/WarCore.Headless.Tests.csproj -c Release --no-build --filter "TestCategory=StackBound"
