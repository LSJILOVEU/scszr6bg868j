name: automerge

# Squash-merge a pull request into main once it carries `reviewed`, has no `hold`, and every check on its current head
# is green: test (ubuntu-latest), test (windows-latest), guard and gate must be success, any other check success or
# skipped. Pull requests touching CLAUDE.md, .github/, .claude/, tools/pii-guard/ or tools/automerge/ are left for a human.
# workflow_run and pull_request_target run the copy on the default branch and never check out pull request code, so a
# pull request cannot change how it gets merged. privacy-gate.yml drops `reviewed` on new pushes; this file does not.
# Merges made with GITHUB_TOKEN do not trigger push workflows; the pull request run is the verification.
# Decision logic: tools/automerge/decide.py (offline tests: tools/automerge/test_decide.py).
on:
  workflow_run:
    workflows: [headless-tests, pii-guard, privacy-gate]
    types: [completed]
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'pull_request_target' && github.event.label.name == 'reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/automerge
      - name: Merge when every check is green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          PRS: ${{ github.event.pull_request.number || join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: bash tools/automerge/run.sh
